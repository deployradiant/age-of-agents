<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age of Agents</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0c0c1a;
    color: #c8c8d8;
    font-family: 'Georgia', 'Palatino Linotype', 'Book Antiqua', serif;
    overflow: hidden;
    display: flex;
    height: 100vh;
    cursor: default;
  }

  #canvas-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #canvas-container canvas { display: block; }

  /* ── Minimap ────────────────────────────────────────────── */
  #minimap-container {
    position: absolute;
    bottom: 12px;
    right: 12px;
    width: 160px;
    height: 120px;
    border: 2px solid #5a3a1a;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 0 16px rgba(0,0,0,0.8);
    cursor: crosshair;
    z-index: 10;
    background: #1a1a0a;
  }
  #minimap-container canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* ── Label overlay ──────────────────────────────────────── */
  #label-container {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }
  .agent-label {
    position: absolute;
    color: #ddd;
    font-size: 11px;
    font-family: 'Georgia', serif;
    text-shadow: 0 0 6px #000, 0 0 3px #000, 1px 1px 2px #000;
    white-space: nowrap;
    pointer-events: none;
    transform: translate(-50%, -100%);
    padding: 2px 6px;
    background: rgba(0,0,0,0.5);
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.08);
    transition: opacity 0.15s;
  }
  .agent-label.selected {
    color: #ffcc44;
    border-color: #ffcc44;
    box-shadow: 0 0 8px rgba(255,204,68,0.3);
  }

  /* ── HUD ────────────────────────────────────────────────── */
  #hud {
    width: 270px;
    background: linear-gradient(180deg, rgba(16,12,28,0.97) 0%, rgba(10,8,20,0.97) 100%);
    border-left: 2px solid #3a2a1a;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    font-size: 13px;
    z-index: 20;
    box-shadow: -4px 0 20px rgba(0,0,0,0.6);
  }
  #hud::-webkit-scrollbar { width: 4px; }
  #hud::-webkit-scrollbar-thumb { background: #3a2a1a; border-radius: 2px; }

  #hud .panel-title {
    font-size: 15px;
    color: #d4a846;
    border-bottom: 1px solid #3a2a1a;
    padding-bottom: 5px;
    margin-bottom: 4px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(212,168,70,0.15);
  }
  #hud .panel-title small { font-size: 10px; color: #776644; letter-spacing: 0; }

  #tick-info {
    font-size: 11px;
    color: #887755;
    font-family: monospace;
    margin-bottom: 4px;
  }

  .section-label {
    font-size: 11px;
    color: #887755;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 6px;
    margin-bottom: 2px;
  }

  .agent-card {
    background: rgba(255,255,255,0.03);
    border-radius: 6px;
    padding: 7px 10px;
    margin-bottom: 3px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
  }
  .agent-card:hover { background: rgba(255,255,255,0.07); }
  .agent-card.selected {
    background: rgba(212,168,70,0.10);
    border-color: rgba(212,168,70,0.3);
  }
  .agent-card .name { font-weight: bold; font-size: 13px; }
  .agent-card .status { font-size: 10px; opacity: 0.6; margin-top: 1px; font-family: monospace; }
  .agent-card .resources { font-size: 10px; margin-top: 2px; color: #998866; }
  .agent-card .health-bar {
    height: 3px; background: #221a0a; border-radius: 2px; margin-top: 4px; overflow: hidden;
  }
  .agent-card .health-bar .fill {
    height: 100%; border-radius: 2px; transition: width 0.3s;
  }

  #resource-count {
    font-size: 11px;
    color: #998866;
    padding: 4px 0;
  }
  #resource-count span { margin-right: 10px; }

  #controls {
    display: flex;
    gap: 6px;
    margin-top: 6px;
    flex-wrap: wrap;
  }
  #controls button {
    background: #1a1428;
    color: #b8a878;
    border: 1px solid #3a2a1a;
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-family: 'Georgia', serif;
    transition: all 0.15s;
  }
  #controls button:hover {
    background: #2a1e3a;
    border-color: #6a4a2a;
    color: #d4c888;
  }

  #event-log-container {
    margin-top: auto;
    padding-top: 4px;
    border-top: 1px solid #2a1a0a;
  }
  #event-log {
    font-size: 10px;
    color: #776655;
    font-family: monospace;
    max-height: 100px;
    overflow-y: auto;
  }
  #event-log::-webkit-scrollbar { width: 3px; }
  #event-log::-webkit-scrollbar-thumb { background: #3a2a1a; border-radius: 2px; }
  #event-log div { padding: 1px 0; opacity: 0.8; }
  #event-log div:nth-child(odd) { opacity: 0.5; }

  /* ── Connection indicator ───────────────────────────────── */
  #conn-status {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    z-index: 15;
    pointer-events: none;
    transition: background 0.3s;
  }
  #conn-status.connected { background: #44cc66; box-shadow: 0 0 8px rgba(68,204,102,0.4); }
  #conn-status.disconnected { background: #cc4444; box-shadow: 0 0 8px rgba(204,68,68,0.4); }
  #conn-status.connecting { background: #ccaa44; box-shadow: 0 0 8px rgba(204,170,68,0.4); }
</style>
</head>
<body>

<div id="canvas-container">
  <div id="conn-status" class="disconnected"></div>
  <div id="minimap-container"><canvas id="minimap-canvas" width="320" height="240"></canvas></div>
  <div id="label-container"></div>
</div>

<div id="hud">
  <div class="panel-title">🏰 Age of Agents <small>v2</small></div>
  <div id="tick-info">Tick: 0 &nbsp;|&nbsp; Time: 0.0s &nbsp;|&nbsp; Agents: 0</div>

  <div class="section-label">⚔️ Warband</div>
  <div id="agent-list"></div>

  <div class="section-label">📦 Resources</div>
  <div id="resource-count"></div>

  <div id="controls">
    <button onclick="resetWorld()">🔄 Reset</button>
    <button onclick="window.selectedAgentId=null;document.querySelectorAll('.agent-card.selected').forEach(e=>e.classList.remove('selected'));updateScene()">✕ Deselect</button>
  </div>

  <div id="event-log-container">
    <div class="section-label" style="margin-top:0">📜 Chronicle</div>
    <div id="event-log"><div>— awaiting dispatch —</div></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── DOM refs ────────────────────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const labelContainer = document.getElementById('label-container');
const eventLog = document.getElementById('event-log');
const agentList = document.getElementById('agent-list');
const tickInfo = document.getElementById('tick-info');
const resourceCount = document.getElementById('resource-count');
const connStatus = document.getElementById('conn-status');
const minimapCanvas = document.getElementById('minimap-canvas');
const minimapCtx = minimapCanvas.getContext('2d');

// ── Scene setup ─────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a14);
scene.fog = new THREE.Fog(0x0a0a14, 400, 1200);

// PerspectiveCamera for better 3D RTS feel
const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 2000);
camera.position.set(500, 500, 700);
camera.lookAt(600, 0, 400);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(600, 0, 400);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.mouseButtons = {
  MIDDLE: THREE.MOUSE.PAN,
  LEFT: null,
  RIGHT: THREE.MOUSE.ROTATE
};
controls.touches = {
  ONE: THREE.TOUCH.PAN,
  TWO: THREE.TOUCH.DOLLY_PAN
};
controls.minDistance = 80;
controls.maxDistance = 1200;
controls.maxPolarAngle = Math.PI / 2.1;
controls.update();

// ── Lighting ────────────────────────────────────────────────────────────
const ambient = new THREE.AmbientLight(0x334466, 0.4);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x8888cc, 0x443322, 0.6);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
sun.position.set(400, 600, 300);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 1200;
sun.shadow.camera.left = -400;
sun.shadow.camera.right = 400;
sun.shadow.camera.top = 400;
sun.shadow.camera.bottom = -400;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x4466aa, 0.3);
fill.position.set(-300, 200, -200);
scene.add(fill);

// ── Ground ──────────────────────────────────────────────────────────────
const groundGeo = new THREE.PlaneGeometry(1400, 1000);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x1a2a1a,
  roughness: 0.95,
  metalness: 0.0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.set(600, -0.5, 400);
ground.receiveShadow = true;
scene.add(ground);

// Grid helper with medieval styling
const gridHelper = new THREE.GridHelper(1400, 28, 0x3a4a2a, 0x2a3a1a);
gridHelper.position.set(600, 0, 400);
scene.add(gridHelper);

// ── Raycaster for click events ──────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const mouse = new THREE.Vector2();

// ── Game objects ────────────────────────────────────────────────────────
const agentMeshes = new Map();  // id -> {group, ring, label, targetMarker, data}
const resourceMeshes = new Map();
const buildingMeshes = new Map();
let selectedAgentId = null;
let world = { agents: {}, resources: [], buildings: [], tick: 0, time: 0, events: [] };

// ── Mesh creation ──────────────────────────────────────────────────────

function createAgentMesh(color) {
  const group = new THREE.Group();

  // Shadow disc
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(10, 16),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.y = 0.1;
  group.add(shadow);

  // Robed body
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(7, 9, 14, 8),
    new THREE.MeshStandardMaterial({
      color: new THREE.Color(color),
      roughness: 0.7,
      metalness: 0.1
    })
  );
  body.position.y = 7;
  body.castShadow = true;
  group.add(body);

  // Tunic trim
  const trim = new THREE.Mesh(
    new THREE.CylinderGeometry(6, 8, 1, 8),
    new THREE.MeshStandardMaterial({ color: 0x886644, roughness: 0.8 })
  );
  trim.position.y = 14;
  group.add(trim);

  // Head
  const head = new THREE.Mesh(
    new THREE.SphereGeometry(5, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0xddbb99, roughness: 0.5 })
  );
  head.position.y = 18;
  head.castShadow = true;
  group.add(head);

  // Hood / hat
  const hat = new THREE.Mesh(
    new THREE.ConeGeometry(5.5, 4, 8),
    new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: 0.8 })
  );
  hat.position.y = 22;
  group.add(hat);

  // Shoulder pads
  for (let side = -1; side <= 1; side += 2) {
    const pad = new THREE.Mesh(
      new THREE.SphereGeometry(3, 6, 6),
      new THREE.MeshStandardMaterial({ color: 0x665544, roughness: 0.6, metalness: 0.3 })
    );
    pad.position.set(side * 6, 14, 0);
    group.add(pad);
  }

  // Selection ring — bright and visible
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(10, 13, 32),
    new THREE.MeshBasicMaterial({
      color: 0xffcc44,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.3;
  group.add(ring);

  // Glow ring (outer)
  const glowRing = new THREE.Mesh(
    new THREE.RingGeometry(13, 16, 32),
    new THREE.MeshBasicMaterial({
      color: 0xffaa00,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide,
      depthWrite: false
    })
  );
  glowRing.rotation.x = -Math.PI / 2;
  glowRing.position.y = 0.2;
  group.add(glowRing);

  return group;
}

function createTargetMarker() {
  const group = new THREE.Group();

  // Cross marker
  const crossMat = new THREE.MeshBasicMaterial({
    color: 0xffcc44,
    transparent: true,
    opacity: 0.8,
    depthWrite: false
  });

  // Four arrows pointing inward
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2;
    const arrow = new THREE.Mesh(
      new THREE.ConeGeometry(2, 5, 4),
      crossMat
    );
    arrow.position.set(Math.cos(angle) * 7, 0.5, Math.sin(angle) * 7);
    arrow.rotation.x = -Math.PI / 2;
    arrow.rotation.z = -angle;
    group.add(arrow);
  }

  // Center dot
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(2, 8),
    new THREE.MeshBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.5, depthWrite: false })
  );
  dot.rotation.x = -Math.PI / 2;
  dot.position.y = 0.5;
  group.add(dot);

  return group;
}

function createResourceMesh(kind) {
  const colors = { wood: 0x4a7a3a, gold: 0xffaa33, food: 0xcc6644, stone: 0x888888 };
  const color = colors[kind] || 0x888888;

  if (kind === 'wood') {
    const group = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(2, 3, 14, 6),
      new THREE.MeshStandardMaterial({ color: 0x5a4a3a, roughness: 0.9 })
    );
    trunk.position.y = 5;
    trunk.castShadow = true;
    group.add(trunk);
    const foliage = new THREE.Mesh(
      new THREE.SphereGeometry(9, 7, 7),
      new THREE.MeshStandardMaterial({ color, roughness: 0.8 })
    );
    foliage.position.y = 15;
    foliage.castShadow = true;
    group.add(foliage);
    // Extra foliage
    const f2 = new THREE.Mesh(
      new THREE.SphereGeometry(7, 6, 6),
      new THREE.MeshStandardMaterial({ color: 0x3a6a2a, roughness: 0.8 })
    );
    f2.position.set(4, 12, 4);
    group.add(f2);
    return group;
  }

  if (kind === 'gold') {
    const mesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(7),
      new THREE.MeshStandardMaterial({ color, roughness: 0.2, metalness: 0.8 })
    );
    mesh.position.y = 5;
    mesh.castShadow = true;
    return mesh;
  }

  if (kind === 'food') {
    const group = new THREE.Group();
    const bush = new THREE.Mesh(
      new THREE.SphereGeometry(8, 7, 7),
      new THREE.MeshStandardMaterial({ color, roughness: 0.9 })
    );
    bush.position.y = 5;
    bush.castShadow = true;
    group.add(bush);
    const berry = new THREE.Mesh(
      new THREE.SphereGeometry(2, 4, 4),
      new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: 0.5 })
    );
    berry.position.set(3, 7, 3);
    group.add(berry);
    const berry2 = new THREE.Mesh(
      new THREE.SphereGeometry(2, 4, 4),
      new THREE.MeshStandardMaterial({ color: 0xcc3333, roughness: 0.5 })
    );
    berry2.position.set(-3, 8, -2);
    group.add(berry2);
    return group;
  }

  // Stone
  const mesh = new THREE.Mesh(
    new THREE.DodecahedronGeometry(6),
    new THREE.MeshStandardMaterial({ color, roughness: 0.9 })
  );
  mesh.position.y = 4;
  mesh.castShadow = true;
  return mesh;
}

function createBuildingMesh(kind) {
  if (kind === 'town_center') {
    const group = new THREE.Group();
    // Stone base
    const base = new THREE.Mesh(
      new THREE.BoxGeometry(44, 12, 44),
      new THREE.MeshStandardMaterial({ color: 0x7a6a5a, roughness: 0.9 })
    );
    base.position.y = 6;
    base.castShadow = true;
    base.receiveShadow = true;
    group.add(base);
    // Walls
    const wall = new THREE.Mesh(
      new THREE.BoxGeometry(40, 14, 40),
      new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.85 })
    );
    wall.position.y = 19;
    wall.castShadow = true;
    group.add(wall);
    // Roof
    const roof = new THREE.Mesh(
      new THREE.ConeGeometry(30, 18, 4),
      new THREE.MeshStandardMaterial({ color: 0x5a3a2a, roughness: 0.8 })
    );
    roof.position.y = 34;
    roof.rotation.y = Math.PI / 4;
    roof.castShadow = true;
    group.add(roof);
    // Banner pole
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(1, 1, 10, 6),
      new THREE.MeshStandardMaterial({ color: 0x665544, roughness: 0.6 })
    );
    pole.position.y = 44;
    group.add(pole);
    return group;
  }

  if (kind === 'barracks') {
    const group = new THREE.Group();
    const base = new THREE.Mesh(
      new THREE.BoxGeometry(36, 10, 28),
      new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 0.9 })
    );
    base.position.y = 5;
    base.castShadow = true;
    group.add(base);
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(38, 6, 30),
      new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.8 })
    );
    roof.position.y = 13;
    roof.castShadow = true;
    group.add(roof);
    return group;
  }

  // Generic building
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(24, 14, 24),
    new THREE.MeshStandardMaterial({ color: 0x6a5a4a, roughness: 0.85 })
  );
  mesh.position.y = 7;
  mesh.castShadow = true;
  return mesh;
}

// ── Label helpers ──────────────────────────────────────────────────────

function createLabelElement(id, name, color) {
  const el = document.createElement('div');
  el.className = 'agent-label';
  el.id = 'label-' + id;
  el.textContent = name;
  el.style.color = color || '#ddd';
  return el;
}

function updateLabelPosition(el, worldPos) {
  const vec = worldPos.clone();
  vec.y += 28; // above the agent
  vec.project(camera);

  const w = container.clientWidth;
  const h = container.clientHeight;
  const x = (vec.x * 0.5 + 0.5) * w;
  const y = (-vec.y * 0.5 + 0.5) * h;

  if (vec.z > 1) {
    el.style.display = 'none';
    return;
  }
  el.style.display = '';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

// ── Scene update ────────────────────────────────────────────────────────

function updateScene() {
  const worldPos = new THREE.Vector3();

  // Agents
  const activeAgentIds = new Set(Object.keys(world.agents));
  for (const [id, obj] of agentMeshes) {
    if (!activeAgentIds.has(id)) {
      scene.remove(obj.group);
      if (obj.label && obj.label.parentNode) obj.label.parentNode.removeChild(obj.label);
      if (obj.targetMarker) scene.remove(obj.targetMarker);
      agentMeshes.delete(id);
    }
  }

  for (const [id, data] of Object.entries(world.agents)) {
    let obj = agentMeshes.get(id);
    if (!obj) {
      const group = createAgentMesh(data.color);
      scene.add(group);
      const label = createLabelElement(id, data.name || 'Peasant', data.color);
      labelContainer.appendChild(label);
      const targetMarker = createTargetMarker();
      targetMarker.visible = false;
      scene.add(targetMarker);
      obj = { group, label, targetMarker };
      agentMeshes.set(id, obj);
    }

    const { group, label, targetMarker } = obj;
    group.position.set(data.x, 0, data.z !== undefined ? data.z : data.y);
    group.rotation.y += 0.01;

    // Selection ring
    const ring = group.children.find(c => c.geometry && c.geometry.type === 'RingGeometry' && c.material.opacity !== undefined);
    const glowRing = group.children.find(c => c.geometry && c.geometry.type === 'RingGeometry' && c !== ring);
    const isSelected = id === selectedAgentId;

    if (ring) {
      ring.material.opacity = isSelected ? 1.0 : 0;
      ring.scale.setScalar(isSelected ? 1.0 : 0.8);
    }
    if (glowRing) {
      const pulse = 0.4 + 0.3 * Math.sin(Date.now() / 300);
      glowRing.material.opacity = isSelected ? pulse : 0;
    }

    // Label
    label.className = 'agent-label' + (isSelected ? ' selected' : '');
    worldPos.set(data.x, 0, data.z !== undefined ? data.z : data.y);
    updateLabelPosition(label, worldPos);

    // Target marker for move orders
    if (data.state === 'active' && data.action === 'move_to' && data.target_x !== undefined) {
      targetMarker.visible = true;
      targetMarker.position.set(data.target_x, 0, data.target_z !== undefined ? data.target_z : data.target_y);
      targetMarker.rotation.y = Date.now() / 1000;
    } else {
      targetMarker.visible = false;
    }
  }

  // Resources
  const activeResIds = new Set(world.resources.map(r => r.id));
  for (const [id, mesh] of resourceMeshes) {
    if (!activeResIds.has(id)) { scene.remove(mesh); resourceMeshes.delete(id); }
  }
  for (const r of world.resources) {
    let mesh = resourceMeshes.get(r.id);
    if (!mesh) {
      mesh = createResourceMesh(r.kind);
      scene.add(mesh);
      resourceMeshes.set(r.id, mesh);
    }
    mesh.position.set(r.x, 0, r.y !== undefined ? r.y : r.z !== undefined ? r.z : 0);
    const s = 0.3 + 0.7 * ((r.amount || 100) / 100);
    mesh.scale.set(s, s, s);
    mesh.rotation.y += 0.003;
    mesh.userData.resourceId = r.id;
    mesh.userData.isResource = true;
  }

  // Buildings
  const activeBuildIds = new Set(world.buildings.map(b => b.id));
  for (const [id, mesh] of buildingMeshes) {
    if (!activeBuildIds.has(id)) { scene.remove(mesh); buildingMeshes.delete(id); }
  }
  for (const b of world.buildings) {
    let mesh = buildingMeshes.get(b.id);
    if (!mesh) {
      mesh = createBuildingMesh(b.kind);
      scene.add(mesh);
      buildingMeshes.set(b.id, mesh);
    }
    mesh.position.set(b.x, 0, b.y !== undefined ? b.y : b.z !== undefined ? b.z : 0);
    mesh.userData.buildingId = b.id;
    mesh.userData.isBuilding = true;
  }

  updateMinimap();
}

// ── Minimap ─────────────────────────────────────────────────────────────

const MINIMAP_W = 320;
const MINIMAP_H = 240;

function updateMinimap() {
  const ctx = minimapCtx;
  ctx.fillStyle = '#1a1a0a';
  ctx.fillRect(0, 0, MINIMAP_W, MINIMAP_H);

  // Determine bounds from world data
  let minX = Infinity, maxX = -Infinity;
  let minZ = Infinity, maxZ = -Infinity;

  for (const a of Object.values(world.agents)) {
    const z = a.z !== undefined ? a.z : a.y;
    if (a.x < minX) minX = a.x;
    if (a.x > maxX) maxX = a.x;
    if (z < minZ) minZ = z;
    if (z > maxZ) maxZ = z;
  }
  for (const r of (world.resources || [])) {
    const z = r.y !== undefined ? r.y : (r.z !== undefined ? r.z : 0);
    if (r.x < minX) minX = r.x;
    if (r.x > maxX) maxX = r.x;
    if (z < minZ) minZ = z;
    if (z > maxZ) maxZ = z;
  }
  for (const b of (world.buildings || [])) {
    const z = b.y !== undefined ? b.y : (b.z !== undefined ? b.z : 0);
    if (b.x < minX) minX = b.x;
    if (b.x > maxX) maxX = b.x;
    if (z < minZ) minZ = z;
    if (z > maxZ) maxZ = z;
  }

  // Fallback bounds
  if (!isFinite(minX)) { minX = 0; maxX = 1200; minZ = 0; maxZ = 800; }
  const rangeX = maxX - minX || 1;
  const rangeZ = maxZ - minZ || 1;

  const pad = 8;
  const drawW = MINIMAP_W - pad * 2;
  const drawH = MINIMAP_H - pad * 2;

  const toScreen = (x, z) => ({
    sx: pad + ((x - minX) / rangeX) * drawW,
    sy: pad + ((z - minZ) / rangeZ) * drawH
  });

  // Draw grid lines
  ctx.strokeStyle = '#2a2a1a';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const t = i / 4;
    ctx.beginPath();
    ctx.moveTo(pad + t * drawW, pad);
    ctx.lineTo(pad + t * drawW, pad + drawH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(pad, pad + t * drawH);
    ctx.lineTo(pad + drawW, pad + t * drawH);
    ctx.stroke();
  }

  // Buildings (squares)
  for (const b of (world.buildings || [])) {
    const z = b.y !== undefined ? b.y : (b.z !== undefined ? b.z : 0);
    const { sx, sy } = toScreen(b.x, z);
    ctx.fillStyle = '#887766';
    ctx.fillRect(sx - 3, sy - 3, 6, 6);
    ctx.fillStyle = '#aa9988';
    ctx.fillRect(sx - 2, sy - 2, 4, 4);
  }

  // Resources (small dots)
  const resColors = { wood: '#4a7a3a', gold: '#ffaa33', food: '#cc6644', stone: '#888888' };
  for (const r of (world.resources || [])) {
    const z = r.y !== undefined ? r.y : (r.z !== undefined ? r.z : 0);
    const { sx, sy } = toScreen(r.x, z);
    ctx.fillStyle = resColors[r.kind] || '#888';
    ctx.beginPath();
    ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Agents (bright dots)
  for (const [id, a] of Object.entries(world.agents)) {
    const z = a.z !== undefined ? a.z : a.y;
    const { sx, sy } = toScreen(a.x, z);
    ctx.fillStyle = a.color || '#88aaff';
    ctx.beginPath();
    ctx.arc(sx, sy, 3, 0, Math.PI * 2);
    ctx.fill();

    // Selected agent highlight
    if (id === selectedAgentId) {
      ctx.strokeStyle = '#ffcc44';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, 5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Camera frustum
  const frustum = getCameraFrustum();
  if (frustum) {
    ctx.strokeStyle = 'rgba(255,255,255,0.2)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < frustum.length; i++) {
      const { sx, sy } = toScreen(frustum[i][0], frustum[i][1]);
      i === 0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy);
    }
    ctx.closePath();
    ctx.stroke();
  }

  // Border
  ctx.strokeStyle = '#5a3a1a';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, MINIMAP_W, MINIMAP_H);
}

function getCameraFrustum() {
  // Approximate frustum corners on the ground plane (y=0)
  const hFov = camera.fov * Math.PI / 180;
  const aspect = camera.aspect;
  const dist = camera.position.distanceTo(controls.target);

  const halfH = dist * Math.tan(hFov / 2);
  const halfW = halfH * aspect;

  // Camera forward and right vectors on the XZ plane
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  dir.y = 0;
  dir.normalize();

  const right = new THREE.Vector3();
  right.crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();

  const center = new THREE.Vector3(camera.position.x, 0, camera.position.z);
  const forward = dir.clone().multiplyScalar(dist / 2);

  return [
    [center.x + forward.x - right.x * halfW, center.z + forward.z - right.z * halfW],
    [center.x + forward.x + right.x * halfW, center.z + forward.z + right.z * halfW],
    [center.x + forward.x + right.x * halfW, center.z + forward.z + right.z * halfW],
    [center.x + forward.x - right.x * halfW, center.z + forward.z - right.z * halfW]
  ];
}

// ── HUD update ──────────────────────────────────────────────────────────

function updateHUD() {
  const agentCount = Object.keys(world.agents).length;
  tickInfo.textContent = `Tick: ${world.tick} | Time: ${(world.time || 0).toFixed(1)}s | Agents: ${agentCount}`;

  // Agent cards
  agentList.innerHTML = '';
  for (const [id, a] of Object.entries(world.agents)) {
    const card = document.createElement('div');
    card.className = 'agent-card' + (id === selectedAgentId ? ' selected' : '');
    card.dataset.agentId = id;

    const healthPct = Math.round(a.health);
    const healthColor = healthPct > 60 ? '#44cc66' : healthPct > 30 ? '#ccaa44' : '#cc4444';
    const statusText = a.state + (a.action ? ' → ' + a.action : '');

    card.innerHTML = `
      <div class="name" style="color:${a.color || '#88aaff'}">${a.name || 'Peasant'}</div>
      <div class="status">${statusText}${a.target_x !== undefined && a.action === 'move_to' ? ' 🎯' : ''}</div>
      <div class="resources">🪵${a.wood||0} 🪙${a.gold||0} 🪨${a.stone||0} 🍖${a.food||0}</div>
      <div class="health-bar"><div class="fill" style="width:${healthPct}%;background:${healthColor}"></div></div>
    `;

    card.addEventListener('click', () => {
      selectAgent(id);
    });

    agentList.appendChild(card);
  }

  // Resource counts
  if (world.resources) {
    const counts = {};
    for (const r of world.resources) {
      counts[r.kind] = (counts[r.kind] || 0) + 1;
    }
    resourceCount.innerHTML = Object.entries(counts)
      .map(([k, v]) => `<span>${k}: ${v}</span>`)
      .join('');
  } else {
    resourceCount.innerHTML = '';
  }

  // Events
  if (world.events && world.events.length > 0) {
    for (const ev of world.events.slice(-5)) {
      const el = document.createElement('div');
      if (typeof ev === 'string') {
        el.textContent = ev;
      } else if (ev.message) {
        el.textContent = ev.message;
      } else {
        el.textContent = JSON.stringify(ev);
      }
      eventLog.appendChild(el);
    }
    while (eventLog.children.length > 50) eventLog.removeChild(eventLog.firstChild);
    eventLog.scrollTop = eventLog.scrollHeight;
  }
}

// ── Selection ──────────────────────────────────────────────────────────

function selectAgent(id) {
  selectedAgentId = id;

  // Update UI classes
  document.querySelectorAll('.agent-card.selected').forEach(e => e.classList.remove('selected'));
  const card = document.querySelector(`.agent-card[data-agent-id="${id}"]`);
  if (card) card.classList.add('selected');

  updateScene();
}

function getClickableObjects() {
  const objects = [];
  for (const [id, obj] of agentMeshes) {
    obj.group.children.forEach(child => {
      child.userData.agentId = id;
      child.userData.isAgent = true;
      objects.push(child);
    });
  }
  for (const [id, mesh] of resourceMeshes) {
    mesh.userData.resourceId = id;
    mesh.userData.isResource = true;
    objects.push(mesh);
  }
  for (const [id, mesh] of buildingMeshes) {
    mesh.userData.buildingId = id;
    mesh.userData.isBuilding = true;
    objects.push(mesh);
  }
  // Also add group roots
  for (const [id, obj] of agentMeshes) {
    obj.group.userData.agentId = id;
    obj.group.userData.isAgent = true;
    objects.push(obj.group);
  }
  return objects;
}

// ── Click / Raycasting ─────────────────────────────────────────────────

function onPointerDown(event) {
  const rect = container.getBoundingClientRect();
  pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  mouse.x = event.clientX;
  mouse.y = event.clientY;
}

function onPointerUp(event) {
  const rect = container.getBoundingClientRect();
  const upX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  const upY = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  // Only process if it's a click (not a drag) — approximate
  const dx = event.clientX - mouse.x;
  const dy = event.clientY - mouse.y;
  if (Math.sqrt(dx * dx + dy * dy) > 8) return;

  raycaster.setFromCamera(new THREE.Vector2(upX, upY), camera);

  const clickables = getClickableObjects();
  const intersects = raycaster.intersectObjects(clickables, false);

  let hitAgent = null;
  let hitResource = null;
  let hitBuilding = null;

  for (const hit of intersects) {
    let obj = hit.object;
    // Walk up to find userData
    while (obj) {
      if (obj.userData && obj.userData.isAgent) {
        hitAgent = obj.userData.agentId;
        break;
      }
      if (obj.userData && obj.userData.isResource) {
        hitResource = obj.userData.resourceId;
        break;
      }
      if (obj.userData && obj.userData.isBuilding) {
        hitBuilding = obj.userData.buildingId;
        break;
      }
      obj = obj.parent;
    }
    if (hitAgent || hitResource || hitBuilding) break;
  }

  // Left click: select
  if (event.button === 0) {
    if (hitAgent && world.agents[hitAgent]) {
      selectAgent(hitAgent);
    } else {
      // Click ground = deselect
      selectedAgentId = null;
      document.querySelectorAll('.agent-card.selected').forEach(e => e.classList.remove('selected'));
      updateScene();
    }
  }

  // Right click: command
  if (event.button === 2 && selectedAgentId && world.agents[selectedAgentId]) {
    const agent = world.agents[selectedAgentId];
    if (!agent) return;

    if (hitResource) {
      // Gather
      const resource = world.resources.find(r => r.id === hitResource);
      if (resource) {
        wsSend({
          type: 'command',
          command: 'gather',
          agent_id: selectedAgentId,
          resource_id: hitResource
        });
        addEvent('Ordered ' + (agent.name || 'agent') + ' to gather ' + (resource.kind || 'resource'));
      }
    } else if (hitAgent) {
      // Click on another agent — could be attack in future, for now just select
      selectAgent(hitAgent);
    } else {
      // Move to ground position
      // Intersect with ground plane
      const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      const raycaster2 = new THREE.Raycaster();
      raycaster2.setFromCamera(new THREE.Vector2(upX, upY), camera);
      const intersectionPoint = new THREE.Vector3();
      const ray = raycaster2.ray;
      const intersectPoint = ray.intersectPlane(groundPlane, intersectionPoint);

      if (intersectPoint) {
        wsSend({
          type: 'command',
          command: 'move_to',
          agent_id: selectedAgentId,
          x: intersectPoint.x,
          y: intersectPoint.z
        });
        addEvent('Moving ' + (agent.name || 'agent') + ' to (' + intersectPoint.x.toFixed(0) + ', ' + intersectPoint.z.toFixed(0) + ')');
      }
    }
  }
}

// ── WebSocket helpers ──────────────────────────────────────────────────

let ws = null;

function wsSend(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
  }
}

function addEvent(text) {
  const el = document.createElement('div');
  el.textContent = text;
  eventLog.appendChild(el);
  while (eventLog.children.length > 50) eventLog.removeChild(eventLog.firstChild);
  eventLog.scrollTop = eventLog.scrollHeight;
}

function connectWebSocket() {
  const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = `${protocol}//${window.location.host}`;

  ws = new WebSocket(wsUrl);
  connStatus.className = 'connecting';

  ws.onopen = () => {
    connStatus.className = 'connected';
    addEvent('Connected to realm');
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);

      if (msg.type === 'state') {
        world = msg;
        updateScene();
        updateHUD();
      }
    } catch (e) {
      console.error('Failed to parse message', e);
    }
  };

  ws.onclose = () => {
    connStatus.className = 'disconnected';
    setTimeout(connectWebSocket, 2000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

window.resetWorld = async function() {
  try {
    await fetch('/reset', { method: 'POST' });
    addEvent('World reset commanded');
  } catch (e) {
    console.error('Reset failed', e);
    addEvent('Reset failed: ' + e.message);
  }
};

// ── Event listeners ────────────────────────────────────────────────────

container.addEventListener('pointerdown', onPointerDown);
container.addEventListener('pointerup', onPointerUp);
container.addEventListener('contextmenu', (e) => e.preventDefault());

// ── Animation loop ──────────────────────────────────────────────────────

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);

  // Update label positions every frame (they move with camera)
  const worldPos = new THREE.Vector3();
  for (const [id, obj] of agentMeshes) {
    if (obj.label && world.agents[id]) {
      const data = world.agents[id];
      worldPos.set(data.x, 0, data.z !== undefined ? data.z : data.y);
      updateLabelPosition(obj.label, worldPos);

      // Pulse selection ring
      if (id === selectedAgentId) {
        const group = obj.group;
        const glowRing = group.children.find(c => c.geometry && c.geometry.type === 'RingGeometry' && c.material.opacity !== undefined && c.material.color.getHex() === 0xffaa00);
        if (glowRing) {
          glowRing.material.opacity = 0.4 + 0.3 * Math.sin(Date.now() / 300);
        }
      }
    }
  }

  // Pulse target markers
  for (const [id, obj] of agentMeshes) {
    if (obj.targetMarker && obj.targetMarker.visible) {
      obj.targetMarker.rotation.y += 0.02;
      const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 400);
      obj.targetMarker.children.forEach(child => {
        if (child.material) child.material.opacity = pulse;
      });
    }
  }
}

// ── Resize ──────────────────────────────────────────────────────────────

function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

window.addEventListener('resize', resize);
resize();

// ── Start ───────────────────────────────────────────────────────────────

connectWebSocket();
animate();

console.log('🏰 Age of Agents v2 loaded — PerspectiveCamera, selection, commands, minimap, labels');
</script>
